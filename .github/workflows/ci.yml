name: CI

on:
  push:
    branches: [main, builder/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy src/ai_shield

      - name: Pytest
        run: uv run pytest --cov=ai_shield --cov-report=term-missing --cov-fail-under=90

      - name: Pytest against mcp 1.x
        # pyproject allows mcp 1.x and 2.x, the lock pins 2.x. This run keeps
        # the 1.x fallback in mcp_server.py honest (FastMCP instead of
        # MCPServer, camelCase field names on the Python side).
        run: uv run --with "mcp<2" pytest -q

      - name: Build sdist + wheel
        run: uv build

      - name: Twine check (validates README rendering on PyPI)
        # twine is in [project.optional-dependencies] dev — fixed in
        # v0.1.1. v0.1.0 had this step but no twine in deps, so CI was
        # red on every push.
        run: uv run twine check dist/*
